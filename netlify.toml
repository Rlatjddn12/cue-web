[[redirects]]
  from = "/post/*"
  to = "/post.html"
  status = 200

[[redirects]]
  from = "/profile/*"
  to = "/profile.html"
  status = 200

[[redirects]]
  from = "/track/*"
  to = "/track.html"
  status = 200

[[redirects]]
  from = "/invite/*"
  to = "/invite.html"
  status = 200

# Universal Links (iOS) and App Links (Android) files: must be served as-is, as JSON, no redirect.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

# Self-hosted fonts never change in place (new weights get new file names).
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"
