<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cue.</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=2">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111010;
      color: #F7F5F0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .logo {
      display: block;
      height: 17px;
      width: auto;
      margin: 0 auto 32px;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: #888;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      background: #F7F5F0;
      color: #111010;
      padding: 14px 32px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .btn-secondary {
      display: block;
      color: #888;
      font-size: 13px;
      text-decoration: none;
      margin-top: 8px;
    }
    .error { color: #FF4444; }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="/assets/cue-wordmark-ivory.svg" alt="cue.">
    <div id="content"></div>
  </div>

  <script>
    const lang = navigator.language.startsWith('ko') ? 'ko' : 'en';
    document.documentElement.lang = lang;

    const copy = {
      title:      { ko: '프로필',           en: 'Profile' },
      desc:       { ko: 'cue.에서 이 프로필을 확인해보세요.', en: 'Check out this profile on cue.' },
      openApp:    { ko: '앱으로 열기',       en: 'Open in cue.' },
      noApp:      { ko: '앱이 없으신가요? 다운로드', en: "Don't have the app? Download" },
      appStore:   { ko: 'App Store에서 다운로드', en: 'Download on the App Store' },
      googlePlay: { ko: 'Google Play 다운로드', en: 'Get it on Google Play' },
      notFound:   { ko: '잘못된 링크입니다', en: 'Invalid link' },
      home:       { ko: '홈으로',           en: 'Go home' },
    };

    function t(key) { return copy[key][lang]; }

    const APP_STORE_URL = 'https://apps.apple.com/kr/app/cue/id6779252040';
    const PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.cueapp.music';

    // iOS (incl. iPadOS reporting as Mac with touch) -> App Store, Android -> Google Play, otherwise both
    function storeLinks() {
      const ua = navigator.userAgent;
      const isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      const isAndroid = /Android/.test(ua);
      if (isIOS) return `<a href="${APP_STORE_URL}" class="btn-secondary">${t('noApp')}</a>`;
      if (isAndroid) return `<a href="${PLAY_STORE_URL}" class="btn-secondary">${t('noApp')}</a>`;
      return `<a href="${APP_STORE_URL}" class="btn-secondary">${t('appStore')}</a>
        <a href="${PLAY_STORE_URL}" class="btn-secondary">${t('googlePlay')}</a>`;
    }

    const content = document.getElementById('content');

    // Path is /profile/{username}
    const parts = window.location.pathname.split('/').filter(Boolean);
    const username = parts.length >= 2 ? decodeURIComponent(parts[1]) : null;

    const userIcon = `
      <svg class="icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="30" stroke="#F7F5F0" stroke-width="2"/>
        <circle cx="32" cy="26" r="9" stroke="#F7F5F0" stroke-width="2"/>
        <path d="M16 50c2-9 9-14 16-14s14 5 16 14" stroke="#F7F5F0" stroke-width="2" stroke-linecap="round"/>
      </svg>`;

    if (!username) {
      content.innerHTML = `
        <h1 class="error">${t('notFound')}</h1>
        <a href="/" class="btn-secondary">${t('home')}</a>
      `;
    } else {
      const deepLink = `cue://profile/${encodeURIComponent(username)}`;
      content.innerHTML = `
        ${userIcon}
        <h1>@${username}</h1>
        <p>${t('desc')}</p>
        <a href="${deepLink}" class="btn">${t('openApp')}</a>
        ${storeLinks()}
      `;
      setTimeout(() => { window.location.href = deepLink; }, 800);
    }
  </script>
</body>
</html>
